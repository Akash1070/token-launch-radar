    <!-- Main Window Background -->
    <rect width="1120" height="615" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <rect width="1120" height="48" rx="12" fill="#161b22" />
    <rect y="36" width="1120" height="12" fill="#161b22" />
    <line x1="0" y1="48" x2="1120" y2="48" stroke="#30363d" stroke-width="1" />

    <!-- Window Traffic Lights -->
    <circle cx="24" cy="24" r="6" fill="#ff5f56" />
    <circle cx="44" cy="24" r="6" fill="#ffbd2e" />
