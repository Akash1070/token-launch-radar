<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0d" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes rowScan {
        0%, 100% { background: transparent; }
        50% { fill: rgba(245, 158, 11, 0.06); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.6; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .pulse { transform-origin: 948px 24px; animation: pulseDot 2s infinite ease-in-out; }
      .row-1-bg { animation: rowScan 3s infinite ease-in-out; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Mono", monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg)" />

  <!-- Grid Pattern Overlay -->
