<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.4)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseBlip {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes rowHighlight {
        0%, 100% { fill: rgba(245, 158, 11, 0.03); }
        50% { fill: rgba(245, 158, 11, 0.12); }
      }
      @keyframes tickerFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .sweep {
        transform-origin: 1040px 140px;
        animation: radarSweep 5s linear infinite;
      }
      .blip1 { transform-origin: 1020px 120px; animation: pulseBlip 2s ease-in-out infinite; }
      .blip2 { transform-origin: 1060px 160px; animation: pulseBlip 2.7s ease-in-out 0.8s infinite; }
      .blip3 { transform-origin: 1000px 150px; animation: pulseBlip 2.2s ease-in-out 1.5s infinite; }
      .active-row { animation: rowHighlight 3s ease-in-out infinite; }
      .ticker-card { animation: tickerFloat 4s ease-in-out infinite; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Mono", monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Terminal Window Container -->
