        <rect width="210" height="66" rx="8" fill="#161b22" stroke="#30363d" />
        <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="600">TOP IMPLIED VALUE</text>
        <text x="16" y="50" fill="#38bdf8" font-size="22" font-weight="700">$313.5M</text>
        <text x="135" y="50" fill="#3fb950" font-size="11">Symbiotic</text>
