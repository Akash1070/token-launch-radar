      <!-- KPI Card 1: Tracked Pre-Token -->
      <g class="ticker-card">
        <rect width="210" height="66" rx="8" fill="#161b22" stroke="#30363d" />
        <text x="16" y="24" fill="#8b949e" font-size="11" font-weight="600">PRE-TOKEN PROTOCOLS</text>
        <text x="16" y="50" fill="#f0f6fc" font-size="22" font-weight="700">226 Scored</text>
